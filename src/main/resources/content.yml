quiz-bank:
  q1:
    prompt: 'How many obsidian blocks are needed to build the smallest functional Nether portal frame?'
    accepted-answers:
      - '10'
      - 'ten'
  q2:
    prompt: 'Which hostile mob drops Breeze Rods inside Trial Chambers?'
    accepted-answers:
      - 'Breeze'
      - 'The Breeze'
  q3:
    prompt: 'What item is combined with a Breeze Rod to craft the Mace?'
    accepted-answers:
      - 'Heavy Core'
  q4:
    prompt: 'Which mob is terrified of cats and ocelots?'
    accepted-answers:
      - 'Creeper'
      - 'Creepers'
      - 'Phantom'
  q5:
    prompt: 'What dimension contains End Cities and Shulkers?'
    accepted-answers:
      - 'The End'
      - 'End'
  q6:
    prompt: 'How many iron ingots are required to craft an Anvil?'
    accepted-answers:
      - '31'
      - 'thirty-one'
      - 'thirty one'
  q7:
    prompt: 'What block is used to power a Conduit underwater?'
    accepted-answers:
      - 'Prismarine'
      - 'Sea Lantern'
      - 'Dark Prismarine'
      - 'Prismarine Bricks'
  q8:
    prompt: 'Which enchantment allows a trident to propel the player through water or rain?'
    accepted-answers:
      - 'Riptide'
  q9:
    prompt: 'What item can be used on a Wolf to equip protective armor?'
    accepted-answers:
      - 'Wolf Armor'
  q10:
    prompt: 'Which sculk block summons the Warden after being triggered four times?'
    accepted-answers:
      - 'Sculk Shrieker'
      - 'Shrieker'
  q11:
    prompt: 'How many bookshelves are required to reach level 30 enchantments?'
    accepted-answers:
      - '15'
      - 'fifteen'
  q12:
    prompt: 'What material is needed to fuel a Brewing Stand?'
    accepted-answers:
      - 'Blaze Powder'
  q13:
    prompt: 'Which passive mob sniffs out Torchflower Seeds and Pitcher Pods?'
    accepted-answers:
      - 'Sniffer'
      - 'The Sniffer'
  q14:
    prompt: 'What item prevents a player from dying when held in main hand or off-hand?'
    accepted-answers:
      - 'Totem of Undying'
      - 'Totem'
  q15:
    prompt: 'How many Netherite Scraps are combined with Gold Ingots to craft one Netherite Ingot?'
    accepted-answers:
      - '4'
      - 'four'
  q16:
    prompt: 'Which redstone block automatically crafts items when powered?'
    accepted-answers:
      - 'Crafter'
  q17:
    prompt: 'What block is used to set your respawn point in the Nether?'
    accepted-answers:
      - 'Respawn Anchor'
  q18:
    prompt: 'Which mob drops Scutes when brushed?'
    accepted-answers:
      - 'Armadillo'
  q19:
    prompt: 'What boss drops the Nether Star upon defeat?'
    accepted-answers:
      - 'Wither'
      - 'The Wither'
  q20:
    prompt: 'What maximum stack size do Ender Pearls have?'
    accepted-answers:
      - '16'
      - 'sixteen'
